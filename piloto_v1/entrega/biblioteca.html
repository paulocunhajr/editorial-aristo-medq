const tags=r=>`<div class="tags">${tg('banca',r.banca)}${tg('grande_area',r.grande_area)}<span class="tag">${r.n_cards} cards</span>${r.tipo.includes('fictício')?'<span class="tag fic">Caso fictício</span>':''}${r.candidato_reel.startsWith('sim')?'<span class="tag reel">Reel?</span>':''}${r.imagens_pendentes.length?`<span class="tag img">${r.imagens_pendentes.length} imagem(ns) a enviar</span>`:''}</div>`;
const stt=r=>`<div class="stt"><span class="${stc(r.status_cientifico)}">Ciência: ${stc(r.status_cientifico).toLowerCase()}</span><span class="${stc(r.status_visual)}">Visual: ${stc(r.status_visual).toLowerCase()}</span></div>`;
function opts(id,k){const v=[...new Set(DATA.map(r=>r[k]))].sort();$(id).insertAdjacentHTML('beforeend',v.map(x=>`<option>${esc(x)}</option>`).join(''))}
function kpis(){$('#notice').textContent=`${DATA.length} carrosséis do piloto (Gate 1), ${DATA.filter(r=>r.status_derivado=='PRONTO').length} prontos. Nada publicado; tudo aguarda revisão docente e visual.`;const R=rows(),q=R.filter(r=>r.tipo=='Questão original').length;$('#kpis').innerHTML=[[R.length,'carrosséis'],[R.reduce((a,r)=>a+r.n_cards,0),'cards'],[new Set(R.map(r=>r.tema)).size,'temas'],[q,'questões'],[R.filter(r=>r.tipo=='Top de dados').length,'tops de dados'],[R.filter(r=>r.status_derivado=='PRONTO').length+'/'+R.length,'prontos']].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('')}
function cal(){const all=base(),[Y,Mo]=CALM.split('-').map(Number),first=new Date(Y,Mo-1,1),nd=new Date(Y,Mo,0).getDate();const ml=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('#calm').textContent=ml[0].toUpperCase()+ml.slice(1);let h=['S','T','Q','Q','S','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');for(let k=0;k<(first.getDay()+6)%7;k++)h+='<div></div>';
 for(let d=1;d<=nd;d++){const iso=`${CALM}-${String(d).padStart(2,'0')}`,ps=all.filter(r=>r.data_prevista==iso);h+=`<button class="day${ps.length?' has':''}${F.day==iso?' sel':''}" ${ps.length?`data-day="${iso}"`:'disabled tabindex="-1"'} aria-label="${d}/${Mo}${ps.length?': '+esc(ps.map(p=>p.marca+', '+p.titulo).join('; ')):', sem post'}">${d}<span class="pips">${ps.map(p=>`<span class="pip ${p.marca}">${p.marca[0]}</span>`).join('')}</span></button>`}
 $('#cal').innerHTML=h;$('#cal').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{F.day=F.day==b.dataset.day?'':b.dataset.day;if(F.day)WEEK=monday(F.day);render()});const mi=MONTHS.indexOf(CALM),mp=$('#mprev'),mn=$('#mnext');mp.disabled=mi<=0;mn.disabled=mi>=MONTHS.length-1;mp.onclick=()=>{CALM=MONTHS[mi-1];cal()};mn.onclick=()=>{CALM=MONTHS[mi+1];cal()}}
function charts(){const R=rows();$('#charts').innerHTML=DIMS.map(([k,t])=>{const cats=[...new Set(DATA.map(r=>r[k]))];const d=cats.map(c=>{const by=Object.fromEntries(BR.map(b=>[b,R.filter(r=>r[k]==c&&r.marca==b).length]));return{c,by,t:by.Aristo+by.MedQ}}).sort((a,b)=>b.t-a.t||a.c.localeCompare(b.c));const mx=Math.max(1,...d.map(x=>x.t));
 return `<div class="chart"><h3>${t}</h3>${d.map(x=>`<div class="row${F.dim==k&&F.val==x.c?' on':''}" data-f="${k}" data-v="${esc(x.c)}" role="button" tabindex="0" aria-label="${esc(t)}: ${esc(x.c)}, ${x.t} (Aristo ${x.by.Aristo}, MedQ ${x.by.MedQ})"><span class="lab">${esc(x.c)}</span><span class="val">${x.t}</span><span class="track">${BR.filter(b=>x.by[b]).map(b=>`<span class="seg ${b}" style="width:${x.by[b]/mx*100}%" data-tip="${b} · ${esc(x.c)}: ${x.by[b]}"></span>`).join('')}</span></div>`).join('')}<details><summary>Tabela</summary><table><tr><th></th><th>A</th><th>M</th></tr>${d.map(x=>`<tr><td>${esc(x.c)}</td><td>${x.by.Aristo}</td><td>${x.by.MedQ}</td></tr>`).join('')}</table></details></div>`}).join('');
 $('#charts').querySelectorAll('[data-f]').forEach(el=>{const a=()=>{if(F.dim==el.dataset.f&&F.val==el.dataset.v)F.dim=F.val=null;else{F.dim=el.dataset.f;F.val=el.dataset.v}render()};el.onclick=a;el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();a()}}});
 const tip=$('#tip');$('#charts').querySelectorAll('.seg').forEach(s=>{s.onmousemove=e=>{tip.textContent=s.dataset.tip;tip.style.opacity=1;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-30+'px'};s.onmouseleave=()=>tip.style.opacity=0})}
function detail(r){const inline=false;const fs=frames(r);let k=0;const h=`<div class="det"><div class="viewer">${inline?'':'<button class="close">Fechar</button>'}<div class="stage"><div id="big"></div><span class="count"></span><button class="nav p" aria-label="Anterior">&#8249;</button><button class="nav n" aria-label="Próximo">&#8250;</button></div><div class="thumbs">${fs.map((f,i)=>fr(f,'t')).join('')}</div></div>
 <div class="info"><div class="tags"><span class="tag" style="color:var(--${r.marca.toLowerCase()}-ink);font-weight:800">${r.marca}</span><span class="tag">${fd(r.data_prevista).full} (prevista)</span>${tg('banca',r.banca)}${tg('grande_area',r.grande_area)}${r.tipo.includes('fictício')?'<span class="tag fic">Caso fictício</span>':''}</div><h2>${esc(r.titulo)}</h2>${stt(r)}
 ${r.zip?`<div class="dls"><a class="dl" href="${r.zip}" download>Baixar post · ${r.n_cards} imagens + legenda</a><button class="dl ghost" id="cp">Copiar legenda</button></div>`:''}
 <div class="cap"><b>Legenda sugerida</b>${esc(r.legenda)}</div><dl><dt>Gabarito · conceito decisivo</dt><dd><b>${r.gabarito}</b> · ${esc(r.conceito_decisivo)}</dd><dt>Principal erro de raciocínio</dt><dd>${esc(r.erro_principal)}</dd>
 <dt>Classificação</dt><dd>${esc(r.grande_area)} · ${esc(r.tema)} · ${esc(r.banca)} · ${esc(r.formato)} · gancho ${esc(r.familia_gancho)} · dificuldade ${esc(r.dificuldade)}</dd>
 ${r.imagens_pendentes.length?`<dt>Imagens originais pendentes</dt><dd><ol>${r.imagens_pendentes.map(p=>`<li>${esc(p.descricao||'sem descrição')}</li>`).join('')}</ol></dd>`:''}
 ${o('Fonte da questão',esc(r.fonte_questao))}${o('Justificativa da seleção (só no HTML)',esc(r.justificativa_selecao))}${o('Texto opcional',esc(r.texto_opcional_carrossel))}
 ${o('Referências',r.referencias.length?`<ol>${r.referencias.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'')}${o('Notas de auditoria',esc(r.notas_auditoria))}<dt>Arquivos</dt><dd><code>${r.pasta}/</code> · ${r.id}</dd></dl></div></div>`;
 const host=inline?$('main'):$('#dlg');host.innerHTML=h;
 const cp=host.querySelector('#cp');if(cp)cp.onclick=()=>navigator.clipboard.writeText(r.legenda).then(()=>{cp.textContent='Legenda copiada'},()=>{const c=host.querySelector('.cap'),g=document.createRange();g.selectNodeContents(c);getSelection().removeAllRanges();getSelection().addRange(g);cp.textContent='Selecionada: copie com Ctrl/Cmd+C'});
 const cnt=host.querySelector('.count'),th=[...host.querySelectorAll('.thumbs>*')];
 const go=n=>{k=(n+fs.length)%fs.length;host.querySelector('#big').outerHTML=`<div id="big">${fr(fs[k])}</div>`;cnt.textContent=`${k+1}/${fs.length}`;th.forEach((t,i)=>t.classList.toggle('on',i==k));const b=host.querySelector('#big').firstChild;b.alt=`${r.titulo}, card ${k+1}`};
host.querySelector('.p').onclick=()=>{go(k-1)};host.querySelector('.n').onclick=()=>{go(k+1)};th.forEach((t,i)=>t.onclick=()=>go(i));
 host.onkeydown=e=>{if(e.key=='ArrowRight')go(k+1);if(e.key=='ArrowLeft')go(k-1)};go(0);
 if(!inline){host.querySelector('.close').onclick=()=>host.close();host.onclick=e=>{if(e.target==host)host.close()};host.showModal()}}
const wire=()=>document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(DATA.find(x=>x.id==b.dataset.id)));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monday=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const WEEKS=[...new Set(DATA.map(r=>monday(r.data_prevista)))].sort();let WEEK=WEEKS[0],CALM=WEEK.slice(0,7);
const dm=s=>new Date(s+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
const MONTHS=[...new Set(DATA.map(r=>r.data_prevista.slice(0,7)))].sort();
function week(R){const d0=new Date(WEEK+'T12:00'),dd=[...Array(7)].map((_,i)=>{const x=new Date(d0);x.setDate(d0.getDate()+i);return iso(x)});const wi=WEEKS.indexOf(WEEK);
 return `<div class="weeknav"><button id="wprev" ${wi<=0?'disabled':''} aria-label="Semana anterior">&#8249;</button><b>Semana de ${dm(dd[0])} a ${dm(dd[6])}</b><button id="wnext" ${wi>=WEEKS.length-1?'disabled':''} aria-label="Próxima semana">&#8250;</button><span class="note" style="margin:0">semana ${wi+1} de ${WEEKS.length}</span></div>
 <div class="lanes"><div class="wk axis">${dd.map(d=>`<span class="${R.some(r=>r.data_prevista==d)?'has':''}${F.day==d?' sel':''}">${fd(d).w} ${fd(d).n}${DAYZ[d]?`<a class="dl xs" href="${DAYZ[d]}" download aria-label="Baixar os posts de ${fd(d).full}">Baixar dia</a>`:''}</span>`).join('')}</div>
 ${BR.map(b=>`<div class="lanelab"><i class="pip ${b}" style="display:inline-block;width:10px;height:10px"></i>${b}</div><div class="wk lane">${dd.map(d=>{const ps=R.filter(x=>x.data_prevista==d&&x.marca==b);return ps.length?ps.map(r=>`<div><button class="post" data-id="${r.id}"><div class="bar ${r.marca}"></div>${fr(frames(r)[0])}<h4>${esc(r.titulo)}</h4>${tags(r)}${stt(r)}</button>${r.zip?`<a class="dl sm" href="${r.zip}" download>Baixar post</a>`:''}</div>`).join(''):'<div class="gap"></div>'}).join('')}</div>`).join('')}</div>
 <p class="note">Tracejado = dia sem post daquela marca. Clique num card para abrir o carrossel e a ficha.</p>`}
function render(){const R=rows();kpis();cal();charts();$('#view').innerHTML=week(R);wire();const wi=WEEKS.indexOf(WEEK),p=$('#wprev'),n=$('#wnext');p.onclick=()=>{WEEK=WEEKS[wi-1];CALM=WEEK.slice(0,7);render()};n.onclick=()=>{WEEK=WEEKS[wi+1];CALM=WEEK.slice(0,7);render()};
 $('#clear').style.display=[F.area,F.banca,F.tipo,F.st,F.day,F.dim].some(Boolean)?'inline-block':'none';
 const s=$('#summary');if(s)s.textContent=`${R.length} de ${DATA.length} carrosséis${F.day?' · '+fd(F.day).full:''}${F.dim?' · '+F.val:''} · datas previstas, nada publicado`}
function init(){opts('#f-area','grande_area');opts('#f-banca','banca');opts('#f-tipo','tipo');
 [['#f-area','area'],['#f-banca','banca'],['#f-tipo','tipo'],['#f-st','st']].forEach(([s,k])=>$(s).onchange=e=>{F[k]=e.target.value;render()});
 $('#clear').onclick=()=>{Object.assign(F,{area:'',banca:'',tipo:'',st:'',day:'',dim:null,val:null});document.querySelectorAll('.filters select').forEach(s=>s.value='');render()};
 const bq=$('#bloq');if(bq)bq.innerHTML=BLOQ.map(b=>`<tr><td>${esc(b.item)}</td><td>${esc(b.motivo)}</td></tr>`).join('');render()}
init();
</script></body></html>
